            renderMilestones();
            startCountdownClock();
            updateUnreadBadges();
            initCardModes();
            updateBirthdayCountdown();
            switchTab(1);
        });

        window.switchTab = function(tabIndex) {
            [screen1, screen2, screen3].forEach((scr, idx) => {
                if (idx === tabIndex - 1) scr.classList.remove('hidden');
                else scr.classList.add('hidden');
            });

            tabBtns.forEach((btn, idx) => {
                if (idx === tabIndex - 1) {
                    btn.classList.add('text-rose-500');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-rose-500');
                    btn.classList.add('text-slate-400');
                }
            });

            if (tabIndex === 1) {
                clockSound.pause();
                screen1.scrollTop = 0;
            } else if (tabIndex === 2) {
                clockSound.pause();
                screen2.scrollTop = 0;
            } else if (tabIndex === 3) {
                clockSound.currentTime = 0;
                clockSound.play().catch(e => {});
                screen3.scrollTop = 0;
            }
        };

        function renderMessages() {
            const container = document.getElementById('messages-list-container');
            container.innerHTML = '';

            MONTHLY_MESSAGES.forEach(msg => {
                const isRead = readMessageIds.includes(msg.id);
                const card = document.createElement('div');
                card.className = `glass-panel p-3 rounded-2xl border transition-all cursor-pointer relative overflow-hidden ${
                    isRead ? 'border-slate-700 bg-slate-800/40' : 'border-rose-500/40 bg-rose-950/20 shadow-md'
                }`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h4 class="font-serif font-bold text-xs ${isRead ? 'text-slate-200' : 'text-rose-400'}">${msg.title}</h4>
                        ${!isRead ? '<span class="w-2 h-2 rounded-full bg-rose-500"></span>' : ''}
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1 line-clamp-2">${msg.preview}</p>
                    <div class="text-right mt-1">
                        <span class="text-[9px] text-slate-400 font-semibold bg-slate-800 px-2 py-0.5 rounded-md border border-slate-700">${msg.date}</span>
                    </div>
                `;

                card.addEventListener('click', () => openMessageModal(msg, 'msg'));
                container.appendChild(card);
            });
        }

        function renderCalendarList() {
            const container = document.getElementById('calendar-list-container');
            container.innerHTML = '';

            const grouped = {};
            CALENDAR_LIST.forEach(item => {
                if (!grouped[item.year]) grouped[item.year] = {};
                if (!grouped[item.year][item.month]) grouped[item.year][item.month] = [];
                grouped[item.year][item.month].push(item);
            });

            Object.keys(grouped).forEach(year => {
                const yearWrapper = document.createElement('div');
                yearWrapper.className = 'space-y-1.5';

                const yearHeader = document.createElement('div');
                yearHeader.className = 'font-serif text-sm font-bold text-rose-400 border-b border-rose-500/30 pb-1 mt-2 cursor-pointer flex justify-between items-center select-none hover:text-rose-300 transition-colors';
                yearHeader.innerHTML = `<span>${year}</span> <i class="fa-solid fa-chevron-down text-xs text-rose-400"></i>`;
                
                const monthsContainer = document.createElement('div');
                monthsContainer.className = 'space-y-2 pl-1';

                let yearOpenState = true;
                yearHeader.addEventListener('click', () => {
                    yearOpenState = !yearOpenState;
                    yearHeader.querySelector('i').className = yearOpenState 
                        ? 'fa-solid fa-chevron-down text-xs text-rose-400' 
                        : 'fa-solid fa-chevron-right text-xs text-rose-400';

                    const monthEventLists = monthsContainer.querySelectorAll('.month-events-list');
                    const monthChevrons = monthsContainer.querySelectorAll('.month-chevron');

                    monthEventLists.forEach(el => {
                        if (yearOpenState) el.classList.remove('hidden');
                        else el.classList.add('hidden');
                    });

                    monthChevrons.forEach(ch => {
                        ch.className = yearOpenState ? 'fa-solid fa-chevron-down text-[9px] month-chevron' : 'fa-solid fa-chevron-right text-[9px] month-chevron';
                    });
                });

                Object.keys(grouped[year]).forEach(month => {
                    const monthGroup = document.createElement('div');
                    monthGroup.className = 'space-y-1 mt-1';

                    const monthHeader = document.createElement('div');
                    monthHeader.className = 'text-[10px] uppercase tracking-wider font-semibold text-slate-300 cursor-pointer flex justify-between items-center bg-slate-800/60 px-2 py-1 rounded-lg border border-slate-700/80 select-none hover:bg-slate-700/60 transition-colors';
                    monthHeader.innerHTML = `<span>${month}</span> <i class="fa-solid fa-chevron-down text-[9px] month-chevron"></i>`;

                    const eventsList = document.createElement('div');
                    eventsList.className = 'space-y-1.5 pl-1.5 mt-1 month-events-list';

                    monthHeader.addEventListener('click', () => {
                        const isHidden = eventsList.classList.toggle('hidden');
                        monthHeader.querySelector('.month-chevron').className = isHidden 
                            ? 'fa-solid fa-chevron-right text-[9px] month-chevron' 
                            : 'fa-solid fa-chevron-down text-[9px] month-chevron';
                    });

                    let lastDateShown = "";
                    grouped[year][month].forEach(item => {
                        const isSameDateAsBefore = (item.date === lastDateShown);
                        lastDateShown = item.date;

                        const card = document.createElement('div');
                        card.id = `cal-item-${item.id}`;
                        card.className = 'glass-panel p-2 rounded-lg border border-slate-700/70 bg-slate-800/40 relative overflow-hidden select-none';

                        const dateBadgeHTML = isSameDateAsBefore ? '' : `<div class="mb-0.5"><span class="text-[8px] text-rose-300 font-bold bg-rose-950/60 px-1.5 py-0.5 rounded border border-rose-500/30">${item.date}</span></div>`;

                        card.innerHTML = `
                            ${dateBadgeHTML}
                            <h4 class="font-serif font-bold text-[11px] text-rose-400 leading-tight">${item.title}</h4>
                            <p class="text-[10px] text-slate-300 mt-0.5 leading-snug">${item.preview}</p>
                        `;

                        eventsList.appendChild(card);
                    });

                    monthGroup.appendChild(monthHeader);
                    monthGroup.appendChild(eventsList);
                    monthsContainer.appendChild(monthGroup);
                });

                yearWrapper.appendChild(yearHeader);
                yearWrapper.appendChild(monthsContainer);
                container.appendChild(yearWrapper);
            });
        }

        function openMessageModal(item, type) {
            document.getElementById('msg-modal-date').innerText = item.date;
            document.getElementById('msg-modal-title').innerText = item.title;
            document.getElementById('msg-modal-body').innerText = item.message;
            document.getElementById('message-modal').classList.remove('hidden');

            msgSound.currentTime = 0;
            msgSound.play().catch(e => {});
            startHeartAnimation();

            if (type === 'msg' && !readMessageIds.includes(item.id)) {
                readMessageIds.push(item.id);
                localStorage.setItem('read_msg_ids', JSON.stringify(readMessageIds));
                renderMessages();
                updateUnreadBadges();
            }
        }

        function closeMessageModal() {
            document.getElementById('message-modal').classList.add('hidden');
            msgSound.pause();
            stopHeartAnimation();
        }

        document.getElementById('close-msg-modal').addEventListener('click', closeMessageModal);

        function startHeartAnimation() {
            stopHeartAnimation();
            const spawnHeart = () => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-rose-500 text-xl';
                heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
                heart.style.left = Math.random() * 80 + 10 + '%';
                heart.style.top = Math.random() * 60 + 20 + '%';
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 3000);
            };
            spawnHeart();
            heartAnimInterval = setInterval(spawnHeart, 3000);
        }

        function stopHeartAnimation() {
            if (heartAnimInterval) {
                clearInterval(heartAnimInterval);
                heartAnimInterval = null;
            }
            document.querySelectorAll('.floating-heart').forEach(el => el.remove());
        }

        function updateUnreadBadges() {
            const unreadMsg = MONTHLY_MESSAGES.filter(m => !readMessageIds.includes(m.id)).length;
            if (unreadMsg > 0) {
                unreadBadgeMsg.innerText = unreadMsg;
                unreadBadgeMsg.classList.remove('hidden');
            } else {
                unreadBadgeMsg.classList.add('hidden');
            }
        }

        function startCountdownClock() {
            const startDate = new Date(2026, 9, 7, 0, 0, 0);

            function updateTimer() {
                const now = new Date();
                const diff = now - startDate;

                if (diff < 0) {
                    document.getElementById('timer-days').innerText = "00";
                    document.getElementById('timer-hours').innerText = "00";
                    document.getElementById('timer-minutes').innerText = "00";
                    document.getElementById('timer-seconds').innerText = "00";
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('timer-days').innerText = String(days).padStart(2, '0');
                document.getElementById('timer-hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('timer-minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('timer-seconds').innerText = String(seconds).padStart(2, '0');
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        function renderMilestones() {
            const container = document.getElementById('milestones-path-container');
            container.innerHTML = '';
            const now = new Date();

            for (let i = 1; i <= 100; i++) {
                const unlockDate = new Date(2026, 9 + (i - 1), 7);
                const isUnlocked = now >= unlockDate;

                const node = document.createElement('div');
                node.className = 'relative z-10 flex items-center justify-center space-x-5 bg-slate-800 p-2.5 rounded-full border border-slate-700 shadow-lg';

                const himPic = isUnlocked ? `philippe${i}.png` : `noyet.png`;
                const herPic = isUnlocked ? `diva${i}.png` : `noyet.png`;
                const usPic = isUnlocked ? `us${i}.png` : `noyet.png`;

                node.innerHTML = `
                    <div class="w-10 h-10 rounded-full overflow-hidden border-2 ${isUnlocked ? 'border-rose-500 animate-bounce-heart' : 'border-slate-700'} bg-slate-800">
                        <img src="${himPic}" alt="Him" class="w-full h-full object-cover" onerror="this.src='${isUnlocked ? 'https://placehold.co/100x100/1e293b/f43f5e?text=Philippe' : 'noyet.png'}'">
                    </div>

                    <div class="text-center px-2">
                        <span class="text-[9px] uppercase tracking-wider text-slate-400 block">Period</span>
                        <span class="text-xs font-bold text-rose-400">#${i}</span>
                    </div>

                    <div class="w-10 h-10 rounded-full overflow-hidden border-2 ${isUnlocked ? 'border-pink-500 animate-bounce-heart' : 'border-slate-700'} bg-slate-800">
                        <img src="${herPic}" alt="Her" class="w-full h-full object-cover" onerror="this.src='${isUnlocked ? 'https://placehold.co/100x100/1e293b/ec4899?text=Diva' : 'noyet.png'}'">
                    </div>
                `;

                if (isUnlocked) {
                    node.classList.add('cursor-pointer', 'hover:scale-105', 'transition-transform');
                    node.addEventListener('click', () => openPhotoModal(usPic));
                } else {
                    node.classList.add('opacity-50');
                }

                container.appendChild(node);
            }
        }

        function openPhotoModal(usPic) {
            document.getElementById('photo-modal-img').src = usPic;
            document.getElementById('photo-modal').classList.remove('hidden');
        }

        document.getElementById('close-photo-modal').addEventListener('click', () => {
            document.getElementById('photo-modal').classList.add('hidden');
        });

        function initCardModes() {
            const prevBtn = document.getElementById('card-nav-prev');
            const nextBtn = document.getElementById('card-nav-next');

            prevBtn.addEventListener('click', () => {
                currentModeIndex = (currentModeIndex - 1 + cardModes.length) % cardModes.length;
                switchCardMode();
            });

            nextBtn.addEventListener('click', () => {
                currentModeIndex = (currentModeIndex + 1) % cardModes.length;
                switchCardMode();
            });
        }

        function switchCardMode() {
            const modeName = cardModes[currentModeIndex];
            const modeTitle = document.getElementById('card-mode-title');

            const containers = {
                "Clock": document.getElementById('mode-clock-container'),
                "Birthday": document.getElementById('mode-birthday-container'),
                "Couple Profil": document.getElementById('mode-profile-container')
            };

            Object.keys(containers).forEach(key => {
                if (key === modeName) containers[key].classList.remove('hidden');
                else containers[key].classList.add('hidden');
            });

            if (modeName === "Clock") {
                modeTitle.innerText = "KAMI TELAH BERSAMA SELAMA";
            } else {
                modeTitle.innerText = modeName.toUpperCase();
            }

            if (profileRotationInterval) {
                clearInterval(profileRotationInterval);
                profileRotationInterval = null;
            }

            if (modeName === "Couple Profil") {
                startProfileRotation();
            }
        }

        function updateBirthdayCountdown() {
            const now = new Date();
            const year = now.getFullYear();

            function getNextBday(month, day) {
                let bday = new Date(year, month - 1, day);
                if (now > bday && (now.getMonth() !== month - 1 || now.getDate() !== day)) {
                    bday.setFullYear(year + 1);
                }
                return bday;
            }

            const himBday = getNextBday(3, 15);
            const herBday = getNextBday(5, 2);

            const isTodayHim = now.getMonth() === 2 && now.getDate() === 15;
            const isTodayHer = now.getMonth() === 4 && now.getDate() === 2;

            const diffHim = Math.ceil((himBday - now) / (1000 * 60 * 60 * 24));
            const diffHer = Math.ceil((herBday - now) / (1000 * 60 * 60 * 24));

            document.getElementById('bday-days-him').innerText = isTodayHim ? "0" : String(diffHim).padStart(2, '0');
            document.getElementById('bday-days-her').innerText = isTodayHer ? "0" : String(diffHer).padStart(2, '0');

            const cardBox = document.getElementById('screen3-dynamic-card');
            if (isTodayHim || isTodayHer) {
                cardBox.classList.add('fireworks-box');
                triggerFireworksEffect();
            } else {
                cardBox.classList.remove('fireworks-box');
            }
        }

        function triggerFireworksEffect() {
            const cardBox = document.getElementById('screen3-dynamic-card');
            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.className = 'firework-spark';
                spark.style.backgroundColor = ['#f43f5e', '#ec4899', '#fbbf24', '#38bdf8'][Math.floor(Math.random() * 4)];
                spark.style.left = '50%';
                spark.style.top = '50%';
                const tx = (Math.random() - 0.5) * 160 + 'px';
                const ty = (Math.random() - 0.5) * 160 + 'px';
                spark.style.setProperty('--tx', tx);
                spark.style.setProperty('--ty', ty);
                cardBox.appendChild(spark);
                setTimeout(() => spark.remove(), 1500);
            }
        }

        function startProfileRotation() {
            const himImg = document.getElementById('profile-him-img');
            const herImg = document.getElementById('profile-her-img');

            function updateProfilePair() {
                const himNum = (profilePairIndex * 2) - 1;
                const herNum = profilePairIndex * 2;

                const testImg = new Image();
                testImg.src = `Coupleprofil${himNum}.png`;
                testImg.onload = function() {
                    himImg.src = `Coupleprofil${himNum}.png`;
                    herImg.src = `Coupleprofil${herNum}.png`;
                    profilePairIndex++;
                };
                testImg.onerror = function() {
                    profilePairIndex = 1;
                    himImg.src = `Coupleprofil1.png`;
                    herImg.src = `Coupleprofil2.png`;
                    profilePairIndex = 2;
                };
            }

            updateProfilePair();
            profileRotationInterval = setInterval(updateProfilePair, 3000);
        }
    </script>
</body>
</html>
